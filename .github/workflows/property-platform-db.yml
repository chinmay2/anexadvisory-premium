name: Property Platform Database

on:
  push:
    branches:
      - main
    paths:
      - "prisma/**"
      - "prisma.config.ts"
      - "package.json"
      - "package-lock.json"
      - "lib/prisma.ts"
      - "app/api/property-platform/**"
      - ".github/workflows/property-platform-db.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and synchronize lockfile
        run: npm install

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create initial migration when missing
        run: |
          if find prisma/migrations -mindepth 1 -maxdepth 1 -type d 2>/dev/null | grep -q .; then
            echo "Prisma migrations already exist."
          else
            mkdir -p prisma/migrations/0001_property_platform
            npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0001_property_platform/migration.sql
          fi

      - name: Commit generated database artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json prisma/migrations
          if git diff --cached --quiet; then
            echo "Database artifacts are already synchronized."
            exit 0
          fi
          git commit -m "chore: synchronize property platform database artifacts"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            git rebase --abort || true
            sleep 5
          done
          echo "Unable to push synchronized database artifacts after retries."
          exit 1

      - name: Test Neon database connection
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          printf 'SELECT current_database(), current_user;\n' | npx prisma db execute --stdin

      - name: Repair failed duplicate initial migration
        if: ${{ env.DATABASE_URL != '' && hashFiles('prisma/migrations/20260907130000_init/**') != '' }}
        run: |
          echo "Resolving the known duplicate migration 20260907130000_init as rolled back."
          npx prisma migrate resolve --rolled-back 20260907130000_init || true
          rm -rf prisma/migrations/20260907130000_init

      - name: Apply database migrations
        if: ${{ env.DATABASE_URL != '' }}
        run: npx prisma migrate deploy

      - name: Report database secret status
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "DATABASE_URL is not configured in GitHub Actions; cloud database migration is waiting for the deployment secret."
